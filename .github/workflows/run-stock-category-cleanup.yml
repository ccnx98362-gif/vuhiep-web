name: Apply stock category cleanup
on:
  push:
    paths:
      - patch_stock_deleted_categories.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_stock_deleted_categories.py
      - run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add index.html
          git commit -m "Hide deleted lens categories from stock" || exit 0
          git push
