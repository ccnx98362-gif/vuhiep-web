name: Add customer notes and editable contact details

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer notes and contact editor
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* CUSTOMER_NOTES_EDITOR_V2 */'
          if marker in s:
              raise SystemExit(0)
          code = r'''
/* CUSTOMER_NOTES_EDITOR_V2 */
const _renderBeforeCustomerNotesV2 = render;
render = function(p){
  _renderBeforeCustomerNotesV2(p);
  if(p==='customers' || p==='salesh') mountCustomerNotesEditorV2(p);
};
function mountCustomerNotesEditorV2(page){
  const main=document.querySelector('#main .page.active');
  if(!main || document.querySelector('#customerNotesEditorV2')) return;
  const rows=[...(db.sales||[])].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const box=document.createElement('div');
  box.id='customerNotesEditorV2'; box.className='card';
  box.innerHTML='<h3 style="margin-top:0">Sửa thông tin đơn cũ</h3><div class="form"><div><label>Chọn đơn</label><select id="v2Sale"></select></div><div><label>Tên khách</label><input id="v2Name"></div><div><label>SĐT</label><input id="v2Phone"></div><div><label>Ghi chú</label><input id="v2Note" placeholder="Ghi chú để xem lại / gọi khách"></div><div style="align-self:end"><button class="btn" id="v2Save">Lưu chỉnh sửa</button></div></div>';
  const h=main.querySelector('h2'); if(h)h.insertAdjacentElement('afterend',box);else main.prepend(box);
  const sel=box.querySelector('#v2Sale'), name=box.querySelector('#v2Name'), phone=box.querySelector('#v2Phone'), note=box.querySelector('#v2Note');
  sel.innerHTML=rows.map(x=>'<option value="'+esc(x.id)+'">'+esc((x.date||'')+' | '+(x.phone||'Không SĐT')+' | '+(typeof saleName==='function'?saleName(x):(x.name||'Chưa có tên')))+'</option>').join('');
  function load(){const x=(db.sales||[]).find(v=>String(v.id)===String(sel.value));if(!x)return;name.value=(typeof saleName==='function'?saleName(x):(x.name||''));phone.value=x.phone||'';note.value=x.note||x.notes||x.ghiChu||'';}
  sel.onchange=load; load();
  box.querySelector('#v2Save').onclick=()=>{const x=(db.sales||[]).find(v=>String(v.id)===String(sel.value));if(!x)return;const oldPhone=String(x.phone||'').trim(),n=name.value.trim(),ph=phone.value.trim(),nt=note.value.trim();x.name=n;x.phone=ph;x.note=nt;if(oldPhone){(db.sales||[]).forEach(v=>{if(v!==x&&String(v.phone||'').trim()===oldPhone&&n)v.name=n;});}save();alert('Đã lưu chỉnh sửa');};

  if(page==='customers'){
    const table=main.querySelector('table');
    if(table){
      const hr=table.querySelector('thead tr');
      if(hr&&!hr.querySelector('.v2-note-head')){const th=document.createElement('th');th.className='v2-note-head';th.textContent='Ghi chú';hr.appendChild(th);}
      const trs=[...table.querySelectorAll('tbody tr')];
      trs.forEach(tr=>{
        if(tr.querySelector('.v2-note-cell'))return;
        const cells=tr.querySelectorAll('td'); const ph=cells[1]?cells[1].textContent.trim():'';
        const related=(db.sales||[]).filter(v=>String(v.phone||'').trim()===ph).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];
        const td=document.createElement('td');td.className='v2-note-cell';td.textContent=related?(related.note||related.notes||related.ghiChu||''):'';tr.appendChild(td);
      });
    }
  }
}
'''
          pos=s.rfind('</script>')
          if pos < 0:
              raise SystemExit('script end not found')
          s=s[:pos]+code+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add customer notes and editable contact details"
          git push
