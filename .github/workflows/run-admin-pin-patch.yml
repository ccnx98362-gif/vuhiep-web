name: Run admin PIN patch
on:
  push:
    paths:
      - patch_admin_pin.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_admin_pin.py
      - run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add index.html
          git commit -m "Add admin PIN and clean BLUE CL" || exit 0
          git push
