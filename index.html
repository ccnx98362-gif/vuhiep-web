<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vũ Hiệp - Quản lý cửa hàng Web V8</title><style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#171717;--muted:#747474;--line:#e5e5e5;--warn:#fff3cd;--bad:#fde2e2;--ok:#e8f7ec}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}header{background:#111;color:#fff;padding:17px 20px;position:sticky;top:0;z-index:5}header b{font-size:19px}.wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 58px)}nav{background:#fff;border-right:1px solid var(--line);padding:14px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px;border-radius:9px;margin:2px 0;cursor:pointer}nav button:hover,nav button.active{background:#111;color:#fff}main{padding:20px;min-width:0}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px #00000008}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{font-size:26px;font-weight:700}.muted{color:var(--muted);font-size:13px}label{display:block;font-size:13px;margin-bottom:5px;color:#444}input,select,textarea{width:100%;padding:10px;border:1px solid #d8d8d8;border-radius:8px;background:#fff}textarea{min-height:70px}.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.btn{border:0;background:#111;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer}.btn.alt{background:#e9e9e9;color:#111}.btn.danger{background:#b42318}.btn.small{padding:7px 9px;font-size:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#fafafa;position:sticky;top:0}.scroll{overflow:auto;max-height:480px}.low{background:var(--warn)!important}.out{background:var(--bad)!important}.ok{background:var(--ok)!important}.tag{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;background:#eee}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.hidden{display:none!important}h2{margin-top:0}@media(max-width:900px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav button{min-width:max-content;width:auto}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(2,1fr)}main{padding:12px}}@media(max-width:520px){.grid,.grid2,.form{grid-template-columns:1fr}header{padding:14px}.stat{font-size:22px}}</style></head><body>
<header><b>VŨ HIỆP • QUẢN LÝ CỬA HÀNG</b> <span class="muted" style="color:#bbb">Web V8 • Đồng bộ online</span><span id="sync" style="float:right;font-size:12px;color:#bbb">Đang kết nối...</span></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script>
const K='vuhiep_v8_cache'; const SB_URL='https://zocommwqqtrdxdoxlwfy.supabase.co'; const SB_KEY='sb_publishable_U3MJkHmlpTaC4dr5OKMT6g_w_hzQVH_'; const today=()=>new Date().toISOString().slice(0,10); const uid=(p)=>p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
const seed={cats:[{id:'c1',name:'Tráng cứng',index:'1.56',add:false,active:true},{id:'c2',name:'Đổi màu',index:'1.56',add:false,active:true},{id:'c3',name:'Lọc ánh sáng xanh',index:'1.56',add:false,active:true},{id:'c4',name:'Đa tròng',index:'1.60',add:true,active:true}],imports:[],sales:[],frames:[],other:[],contacts:[],adjustments:[]};
let db=JSON.parse(localStorage.getItem(K)||'null')||structuredClone(seed), syncBusy=false;
function normalize(){db.cats??=[];db.imports??=[];db.sales??=[];db.frames??=[];db.other??=[];db.contacts??=[];db.adjustments??=[]}
function isEditing(){let e=document.activeElement;return !!(e&&['INPUT','SELECT','TEXTAREA'].includes(e.tagName))}
async function cloudLoad(initial=false){try{let r=await fetch(SB_URL+'/rest/v1/vuhiep_store?id=eq.main&select=data',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});if(!r.ok)throw Error(await r.text());let a=await r.json();if(a[0]?.data&&initial){db=a[0].data;normalize();localStorage.setItem(K,JSON.stringify(db));render(active);restoreImportForm()}setSync('Đã đồng bộ')}catch(e){console.error(e);setSync('Mất kết nối - đang dùng bản lưu trên máy')}}
async function cloudSave(snapshot){try{syncBusy=true;setSync('Đang đồng bộ...');let r=await fetch(SB_URL+'/rest/v1/vuhiep_store?id=eq.main',{method:'PATCH',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({data:snapshot,updated_at:new Date().toISOString()})});if(!r.ok)throw Error(await r.text());setSync('Đã đồng bộ')}catch(e){console.error(e);setSync('Lỗi đồng bộ - dữ liệu đã lưu tạm trên máy')}finally{syncBusy=false}}
function setSync(t){let e=document.querySelector('#sync');if(e)e.textContent=t}
function save(){normalize();localStorage.setItem(K,JSON.stringify(db));let snap=JSON.parse(JSON.stringify(db));render(active);cloudSave(snap)}

const sph=Array.from({length:161},(_,i)=>(-20+i*.25).toFixed(2)); const cyl=Array.from({length:25},(_,i)=>(-6+i*.25).toFixed(2)); const adds=Array.from({length:13},(_,i)=>'+'+(1+i*.25).toFixed(2));
const pages=[['dash','Tổng quan'],['sale','Bán / Cắt kính'],['stock','Kho tròng kính'],['cats','Danh mục tròng'],['import','Nhập hàng'],['imph','Lịch sử nhập'],['salesh','Lịch sử bán'],['customers','Khách hàng'],['frames','Gọng kính'],['other','Đồng hồ / phụ kiện'],['report','Báo cáo']];
let active='dash'; const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function opt(a,v=''){return a.map(x=>'<option '+(String(x)==String(v)?'selected':'')+'>'+esc(x)+'</option>').join('')}
function nav(){document.querySelector('#nav').innerHTML=pages.map(([k,n])=>'<button data-p="'+k+'" class="'+(active==k?'active':'')+'">'+n+'</button>').join(''); document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{active=b.dataset.p;render(active)})}
function catKey(c){return c.name+'|'+c.index} function catsActive(){return db.cats.filter(x=>x.active)}
function stockRows(){let m={}; db.imports.forEach(x=>{let k=[x.cat,x.index,x.sph,x.cyl,x.add||''].join('|');m[k]??={cat:x.cat,index:x.index,sph:x.sph,cyl:x.cyl,add:x.add||'',imp:0,sold:0,sold30:0};m[k].imp+=+x.qty}); let cutoff=new Date();cutoff.setDate(cutoff.getDate()-30); db.sales.forEach(s=>{[['R',s.rsph,s.rcyl,s.radd],['L',s.lsph,s.lcyl,s.ladd]].forEach(z=>{let k=[s.cat,s.index,z[1],z[2],z[3]||''].join('|');m[k]??={cat:s.cat,index:s.index,sph:z[1],cyl:z[2],add:z[3]||'',imp:0,sold:0,sold30:0};m[k].sold++;if(new Date(s.date)>=cutoff)m[k].sold30++})}); db.adjustments.forEach(a=>{let k=[a.cat,a.index,a.sph,a.cyl,a.add||''].join('|');m[k]??={cat:a.cat,index:a.index,sph:a.sph,cyl:a.cyl,add:a.add||'',imp:0,sold:0,sold30:0,adj:0};m[k].adj=(m[k].adj||0)+(+a.delta||0)}); return Object.values(m).map(x=>({...x,adj:x.adj||0,qty:x.imp-x.sold+(x.adj||0)}))}
function status(q){return q<=0?'HẾT HÀNG':q<=6?'SẮP HẾT':'Bình thường'} function cls(q){return q<=0?'out':q<=6?'low':'ok'}
function due(){return db.sales.map(s=>{let d=new Date(s.date);d.setDate(d.getDate()+30);let days=Math.ceil((d-new Date(new Date().toDateString()))/86400000);return {...s,due:d.toISOString().slice(0,10),days}}).filter(x=>x.days<=3&&x.days>=-7&&!db.contacts.includes(x.id))}
function render(p){nav();let h=''; if(p==='dash')h=dash();if(p==='sale')h=sale();if(p==='stock')h=stock();if(p==='cats')h=cats();if(p==='import')h=imp();if(p==='imph')h=imph();if(p==='salesh')h=salesh();if(p==='customers')h=customers();if(p==='frames')h=frames();if(p==='other')h=other();if(p==='report')h=report();document.querySelector('#main').innerHTML='<section class="page active">'+h+'</section>';bind(p)}
function dash(){let st=stockRows(),d=due(),low=st.filter(x=>x.qty>0&&x.qty<=6),out=st.filter(x=>x.qty<=0);return '<h2>Tổng quan</h2><div class="grid"><div class="card"><div class="muted">Đơn kính</div><div class="stat">'+db.sales.length+'</div></div><div class="card low"><div class="muted">SKU tròng sắp hết</div><div class="stat">'+low.length+'</div></div><div class="card out"><div class="muted">SKU hết hàng</div><div class="stat">'+out.length+'</div></div><div class="card"><div class="muted">Khách cần chăm sóc</div><div class="stat">'+d.length+'</div></div></div><div class="card"><h3>⚠ Tròng sắp hết (còn 1–6)</h3>'+tbl(['Loại tròng','Chiết suất','SPH','CYL','ADD','Tồn còn'],low.map(x=>({class:'low',cells:[x.cat,x.index,x.sph,x.cyl,x.add||'-',x.qty]})))+'</div><div class="card"><h3>⛔ Tròng hết hàng</h3>'+tbl(['Loại tròng','Chiết suất','SPH','CYL','ADD','Tồn'],out.map(x=>({class:'out',cells:[x.cat,x.index,x.sph,x.cyl,x.add||'-',x.qty]})))+'</div><div class="card"><h3>Nhắc khách khoảng 30 ngày</h3>'+tbl(['Khách','SĐT','Ngày cắt','Đến hạn','Còn/Quá',''],d.map(x=>[x.name,x.phone,x.date,x.due,(x.days>=0?'Còn '+x.days:'Quá '+(-x.days))+' ngày','<button class="btn small contact" data-id="'+x.id+'">Đã liên hệ</button>']))+'</div>'}
function sale(){let cs=catsActive();return '<h2>Bán / Cắt kính</h2><div class="card"><div class="form"><div><label>Ngày bán/cắt</label><input id="date" type="date" value="'+today()+'"></div><div><label>Tên khách</label><input id="name"></div><div><label>Số điện thoại</label><input id="phone"></div><div><label>Loại tròng</label><select id="cat">'+cs.map(c=>'<option data-add="'+c.add+'" data-index="'+c.index+'">'+esc(c.name)+'</option>').join('')+'</select></div><div><label>Chiết suất</label><select id="index"></select></div><div><label>Kiểu độ</label><select id="rxmode"><option value="sphere">Không loạn</option><option value="cyl">Có loạn</option></select></div><div><label>SPH phải (chỉ độ đang có)</label><select id="rsph"></select></div><div class="cylf hidden"><label>CYL phải</label><select id="rcyl"></select></div><div class="addf"><label>ADD phải</label><select id="radd"></select></div><div><label>SPH trái (chỉ độ đang có)</label><select id="lsph"></select></div><div class="cylf hidden"><label>CYL trái</label><select id="lcyl"></select></div><div class="addf"><label>ADD trái</label><select id="ladd"></select></div><div><label>Mã gọng</label><input id="frame"></div><div><label>Tiền tròng</label><input id="lensPrice" type="number" value="0"></div><div><label>Tiền gọng</label><input id="framePrice" type="number" value="0"></div><div><label>Giảm giá</label><input id="discount" type="number" value="0"></div><div><label>Ghi chú</label><input id="note"></div></div><br><button class="btn" id="saveSale">Lưu đơn & trừ kho</button><p class="muted">Mục bán chỉ hiện các độ tròng hiện đang có tồn kho. Chọn “Có loạn” mới hiện CYL.</p></div>'}
function stock(){let r=stockRows();return '<h2>Kho tròng kính</h2><div class="card"><p class="muted">Nếu nhập nhầm số lượng, bấm <b>Điều chỉnh tồn</b>. Hệ thống lưu lịch sử điều chỉnh riêng, không tạo đơn bán giả.</p>'+tbl(['Loại','Chiết suất','SPH','CYL','ADD','Đã nhập','Đã bán','Điều chỉnh','Bán 30 ngày','Tồn','Trạng thái',''],r.map(x=>({class:cls(x.qty),cells:[x.cat,x.index,x.sph,x.cyl,x.add,x.imp,x.sold,x.adj||0,x.sold30,x.qty,status(x.qty),'<button class="btn small adjustStock" data-cat="'+esc(x.cat)+'" data-index="'+esc(x.index)+'" data-sph="'+esc(x.sph)+'" data-cyl="'+esc(x.cyl)+'" data-add="'+esc(x.add||'')+'" data-qty="'+x.qty+'">Điều chỉnh tồn</button>']})))+'</div><div class="card"><h3>Lịch sử điều chỉnh kho</h3>'+tbl(['Ngày','Loại','CS','SPH','CYL','ADD','Thay đổi','Lý do'],db.adjustments.slice().reverse().map(a=>[a.date,a.cat,a.index,a.sph,a.cyl,a.add||'-',(a.delta>0?'+':'')+a.delta,a.reason]))+'</div>'}
function cats(){return '<h2>Danh mục tròng</h2><div class="card"><div class="form"><div><label>Tên loại tròng</label><input id="cname" placeholder="VD: Đổi màu"></div><div><label>Chiết suất</label><input id="cindex" placeholder="VD: 1.56 / 1.60 / 1.67"></div><div><label>Có ADD?</label><select id="cadd"><option value="0">Không</option><option value="1">Có</option></select></div><div style="align-self:end"><button class="btn" id="addCat">Thêm danh mục</button></div></div></div><div class="card">'+tbl(['Loại tròng','Chiết suất','ADD','Trạng thái',''],db.cats.map(c=>[c.name,c.index,c.add?'Có':'Không',c.active?'Đang dùng':'Ngừng dùng','<button class="btn small '+(c.active?'danger':'alt')+' toggleCat" data-id="'+c.id+'">'+(c.active?'Ngừng dùng':'Khôi phục')+'</button>']))+'</div>'}
function imp(){let cs=catsActive();return '<h2>Nhập tròng kính</h2><div class="card"><div class="form"><div><label>Ngày nhập</label><input id="idate" type="date" value="'+today()+'"></div><div><label>Loại tròng</label><select id="icat">'+cs.map(c=>'<option>'+esc(c.name)+'</option>').join('')+'</select></div><div><label>Chiết suất</label><select id="iindex"></select></div><div><label>SPH</label><select id="isph">'+opt(sph,'0.00')+'</select></div><div><label>CYL</label><select id="icyl">'+opt(cyl,'0.00')+'</select></div><div class="iaddf"><label>ADD</label><select id="iadd">'+opt(adds)+'</select></div><div><label>Số lượng</label><input id="iqty" type="number" min="1" value="2"></div><div><label>Giá nhập / tròng</label><input id="icost" type="number" value="0"></div><div><label>Nhà cung cấp</label><input id="isupplier"></div><div><label>Ghi chú</label><input id="inote"></div></div><br><button class="btn" id="saveImp">Lưu lần nhập</button><p class="muted">Mỗi lần nhập được lưu thành một dòng lịch sử riêng, không ghi đè lần nhập cũ.</p></div>'}
function imph(){return '<h2>Lịch sử nhập</h2><div class="card">'+tbl(['Ngày','Loại','Chiết suất','SPH','CYL','ADD','SL','Giá nhập','NCC','Ghi chú'],db.imports.slice().reverse().map(x=>[x.date,x.cat,x.index,x.sph,x.cyl,x.add,x.qty,x.cost,x.supplier,x.note]))+'</div>'}
function salesh(){return '<h2>Lịch sử bán</h2><div class="card">'+tbl(['Ngày','Khách','SĐT','Loại','CS','Mắt phải','Mắt trái','Gọng','Tổng'],db.sales.slice().reverse().map(x=>[x.date,x.name,x.phone,x.cat,x.index,x.rsph+'/'+x.rcyl+(x.radd?'/'+x.radd:''),x.lsph+'/'+x.lcyl+(x.ladd?'/'+x.ladd:''),x.frame,x.total.toLocaleString('vi-VN')]))+'</div>'}
function customers(){let m={};db.sales.forEach(s=>{let k=s.phone||s.name;m[k]??={name:s.name,phone:s.phone,n:0,last:'',orders:[]};m[k].n++;if(s.date>m[k].last)m[k].last=s.date;m[k].orders.push(s)});return '<h2>Khách hàng</h2><div class="card">'+tbl(['Tên','SĐT','Số lần mua','Lần gần nhất','Đơn gần nhất'],Object.values(m).map(x=>{let s=x.orders.sort((a,b)=>b.date.localeCompare(a.date))[0];return[x.name,x.phone,x.n,x.last,s.cat+' '+s.index+' | P '+s.rsph+'/'+s.rcyl+' | T '+s.lsph+'/'+s.lcyl]}))+'</div>'}
function frames(){return '<h2>Kho gọng kính</h2><div class="card"><div class="form"><input id="fcode" placeholder="Mã gọng"><input id="fname" placeholder="Tên / mẫu"><input id="fbrand" placeholder="Thương hiệu"><input id="fcolor" placeholder="Màu"><input id="fqty" type="number" placeholder="Số lượng"><input id="fcost" type="number" placeholder="Giá nhập"><input id="fprice" type="number" placeholder="Giá bán"><input id="fsupplier" placeholder="Nhà cung cấp"></div><br><button class="btn" id="saveFrame">Nhập gọng</button></div><div class="card">'+tbl(['Mã','Tên','Thương hiệu','Màu','Tồn','Giá nhập','Giá bán','NCC'],db.frames.map(x=>[x.code,x.name,x.brand,x.color,x.qty,x.cost,x.price,x.supplier]))+'</div>'}
function other(){return '<h2>Đồng hồ / phụ kiện</h2><div class="card"><div class="form"><input id="ocode" placeholder="Mã hàng"><select id="ogroup"><option>Đồng hồ</option><option>Dây đồng hồ</option><option>Pin</option><option>Phụ kiện</option></select><input id="oname" placeholder="Tên sản phẩm"><input id="oqty" type="number" placeholder="Số lượng"><input id="ocost" type="number" placeholder="Giá nhập"><input id="oprice" type="number" placeholder="Giá bán"><input id="osupplier" placeholder="Nhà cung cấp"></div><br><button class="btn" id="saveOther">Nhập hàng</button></div><div class="card">'+tbl(['Mã','Nhóm','Tên','Tồn','Giá nhập','Giá bán','NCC'],db.other.map(x=>[x.code,x.group,x.name,x.qty,x.cost,x.price,x.supplier]))+'</div>'}
function report(){let rev=db.sales.reduce((a,x)=>a+x.total,0),st=stockRows();let by={};st.forEach(x=>{by[x.cat]??={qty:0,sold:0};by[x.cat].qty+=x.qty;by[x.cat].sold+=x.sold});return '<h2>Báo cáo</h2><div class="grid"><div class="card"><div class="muted">Doanh thu ghi nhận</div><div class="stat">'+rev.toLocaleString('vi-VN')+'đ</div></div><div class="card"><div class="muted">Tổng đơn</div><div class="stat">'+db.sales.length+'</div></div><div class="card"><div class="muted">Tổng tròng còn</div><div class="stat">'+st.reduce((a,x)=>a+x.qty,0)+'</div></div><div class="card"><div class="muted">Lần nhập tròng</div><div class="stat">'+db.imports.length+'</div></div></div><div class="card"><h3>Theo loại tròng</h3>'+tbl(['Loại','Đã bán','Tồn hiện tại'],Object.entries(by).map(([k,v])=>[k,v.sold,v.qty]))+'</div>'}
function tbl(head,rows){return '<div class="scroll"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>{let cells=r.cells||r;return '<tr class="'+(r.class||'')+'">'+cells.map(x=>'<td>'+escHtml(x)+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>'} function escHtml(x){return String(x??'').startsWith('<button')?String(x):esc(x)}
function bind(p){if(p==='dash')document.querySelectorAll('.contact').forEach(b=>b.onclick=()=>{db.contacts.push(b.dataset.id);save()});if(p==='cats'){addCat.onclick=()=>{if(!cname.value.trim()||!cindex.value.trim())return alert('Nhập tên tròng và chiết suất');db.cats.push({id:uid('c'),name:cname.value.trim(),index:cindex.value.trim(),add:cadd.value==='1',active:true});save()};document.querySelectorAll('.toggleCat').forEach(b=>b.onclick=()=>{let c=db.cats.find(x=>x.id===b.dataset.id);if(c.active){let confirmText='NGUNG '+c.name+' '+c.index;let x=prompt('Để tránh bấm nhầm, nhập chính xác:\n'+confirmText);if(x!==confirmText)return alert('Chưa đúng xác nhận. Không thay đổi.')}c.active=!c.active;save()})}if(p==='stock')document.querySelectorAll('.adjustStock').forEach(b=>b.onclick=()=>{let current=+b.dataset.qty;let v=prompt('Tồn hiện tại: '+current+' tròng.\nNhập SỐ LƯỢNG TỒN ĐÚNG bạn muốn sửa thành:',current);if(v===null)return;let target=Number(v);if(!Number.isInteger(target)||target<0)return alert('Số lượng tồn phải là số nguyên từ 0 trở lên.');let delta=target-current;if(delta===0)return alert('Số lượng không thay đổi.');let reason=prompt('Lý do điều chỉnh (VD: nhập nhầm, kiểm kho thực tế):','Nhập nhầm');if(reason===null)return;let ok=confirm('Xác nhận sửa tồn từ '+current+' thành '+target+'?\nThay đổi: '+(delta>0?'+':'')+delta+' tròng.');if(!ok)return;db.adjustments.push({id:uid('a'),date:today(),cat:b.dataset.cat,index:b.dataset.index,sph:b.dataset.sph,cyl:b.dataset.cyl,add:b.dataset.add||'',delta:delta,from:current,to:target,reason:reason.trim()||'Điều chỉnh kho'});save();alert('Đã điều chỉnh tồn kho. Không tạo đơn bán.')});if(p==='sale')bindSale();if(p==='import')bindImp();if(p==='frames')saveFrame.onclick=()=>{db.frames.push({id:uid('f'),code:fcode.value,name:fname.value,brand:fbrand.value,color:fcolor.value,qty:+fqty.value||0,cost:+fcost.value||0,price:+fprice.value||0,supplier:fsupplier.value,date:today()});save()};if(p==='other')saveOther.onclick=()=>{db.other.push({id:uid('o'),code:ocode.value,group:ogroup.value,name:oname.value,qty:+oqty.value||0,cost:+ocost.value||0,price:+oprice.value||0,supplier:osupplier.value,date:today()});save()}}
function setIndexes(catEl,indexEl){let arr=[...new Set(catsActive().filter(c=>c.name===catEl.value).map(c=>c.index))];indexEl.innerHTML=opt(arr)}
function bindSale(){function vals(field,extra={}){let rows=stockRows().filter(x=>x.qty>0&&x.cat===cat.value&&x.index===index.value);Object.entries(extra).forEach(([k,v])=>rows=rows.filter(x=>String(x[k]||'')===String(v||'')));return [...new Set(rows.map(x=>x[field]))].sort((a,b)=>parseFloat(a)-parseFloat(b))}function fill(sel,a,preferred){sel.innerHTML=opt(a,preferred&&a.includes(preferred)?preferred:a[0])}function refresh(){setIndexes(cat,index);let cc=catsActive().find(x=>x.name===cat.value&&x.index===index.value);let hasAdd=!!cc?.add;document.querySelectorAll('.addf').forEach(e=>e.classList.toggle('hidden',!hasAdd));let isCyl=rxmode.value==='cyl';document.querySelectorAll('.cylf').forEach(e=>e.classList.toggle('hidden',!isCyl));let rows=stockRows().filter(x=>x.qty>0&&x.cat===cat.value&&x.index===index.value);if(!isCyl)rows=rows.filter(x=>parseFloat(x.cyl||0)===0);let sp=[...new Set(rows.map(x=>x.sph))].sort((a,b)=>parseFloat(a)-parseFloat(b));fill(rsph,sp,rsph.value);fill(lsph,sp,lsph.value);let cr=vals('cyl',{sph:rsph.value});let cl=vals('cyl',{sph:lsph.value});if(isCyl){fill(rcyl,cr,rcyl.value);fill(lcyl,cl,lcyl.value)}else{rcyl.innerHTML='<option>0.00</option>';lcyl.innerHTML='<option>0.00</option>'}if(hasAdd){let ar=vals('add',{sph:rsph.value,cyl:isCyl?rcyl.value:'0.00'});let al=vals('add',{sph:lsph.value,cyl:isCyl?lcyl.value:'0.00'});fill(radd,ar,radd.value);fill(ladd,al,ladd.value)}}cat.onchange=refresh;index.onchange=refresh;rxmode.onchange=refresh;rsph.onchange=refresh;lsph.onchange=refresh;rcyl.onchange=refresh;lcyl.onchange=refresh;setIndexes(cat,index);refresh();saveSale.onclick=()=>{if(!rsph.value||!lsph.value)return alert('Không có tròng tồn kho phù hợp với lựa chọn này.');let cc=catsActive().find(x=>x.name===cat.value&&x.index===index.value),hasAdd=!!cc?.add,isCyl=rxmode.value==='cyl';let s={id:uid('s'),date:date.value,name:name.value,phone:phone.value,cat:cat.value,index:index.value,rsph:rsph.value,rcyl:isCyl?rcyl.value:'0.00',radd:hasAdd?radd.value:'',lsph:lsph.value,lcyl:isCyl?lcyl.value:'0.00',ladd:hasAdd?ladd.value:'',frame:frame.value,lensPrice:+lensPrice.value||0,framePrice:+framePrice.value||0,discount:+discount.value||0,note:note.value};s.total=s.lensPrice+s.framePrice-s.discount;let st=stockRows();let need={};for(let z of [[s.rsph,s.rcyl,s.radd],[s.lsph,s.lcyl,s.ladd]]){let k=z.join('|');need[k]=(need[k]||0)+1}for(let [k,n] of Object.entries(need)){let z=k.split('|');let q=st.find(x=>x.cat===s.cat&&x.index===s.index&&x.sph===z[0]&&x.cyl===z[1]&&(x.add||'')===(z[2]||''))?.qty||0;if(q<n)return alert('Không đủ tồn kho cho độ '+z.join('/')+'. Hiện còn '+q+' tròng.')}db.sales.push(s);save();alert('Đã lưu đơn và trừ kho')}}function restoreImportForm(){try{let x=JSON.parse(sessionStorage.getItem('vuhiep_last_import')||'null');if(!x||active!=='import')return;let set=(id,val)=>{let e=document.getElementById(id);if(e&&val!==undefined&&val!==null)e.value=String(val)};set('idate',x.date);set('icat',x.cat);setIndexes(icat,iindex);set('iindex',x.index);set('isph',x.sph);set('icyl',x.cyl);set('iadd',x.add);set('iqty',2);set('icost',x.cost);set('isupplier',x.supplier);set('inote',x.note)}catch(e){console.error(e)}}
function bindImp(){setIndexes(icat,iindex);function upd(){setIndexes(icat,iindex);let c=catsActive().find(x=>x.name===icat.value&&x.index===iindex.value);document.querySelectorAll('.iaddf').forEach(e=>e.classList.toggle('hidden',!c?.add))}icat.onchange=upd;iindex.onchange=upd;upd();saveImp.onclick=()=>{let c=catsActive().find(x=>x.name===icat.value&&x.index===iindex.value);let last={date:idate.value,cat:icat.value,index:iindex.value,sph:isph.value,cyl:icyl.value,add:c?.add?iadd.value:'',cost:+icost.value||0,supplier:isupplier.value,note:inote.value};db.imports.push({id:uid('i'),date:last.date,cat:last.cat,index:last.index,sph:last.sph,cyl:last.cyl,add:last.add,qty:+iqty.value||0,cost:last.cost,supplier:last.supplier,note:last.note});sessionStorage.setItem('vuhiep_last_import',JSON.stringify(last));save();setTimeout(restoreImportForm,0);alert('Đã lưu lần nhập. Giữ nguyên độ vừa nhập để bạn nhập độ kế tiếp.')}}normalize();render(active);restoreImportForm();cloudLoad(true);
</script></body></html>
